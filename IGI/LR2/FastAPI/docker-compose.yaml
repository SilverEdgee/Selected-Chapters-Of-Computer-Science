services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - backend_network
  cache:
    image: redis
    container_name: redis_cache
    networks:
      - backend_network
  app:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - cache
    networks:
      - backend_network
networks:
  backend_network:
    driver: bridge
volumes:
  db:
