{% extends 'catalog/base.html' %}
{% block title %}Вакансии{% endblock %}
{% block content %}
<h1>Вакансии</h1>
<div class="vacancy-list">
{% for vacancy in vacancies %}
    <article class="card vacancy-card">
        <p><strong>{{ vacancy.title }}</strong></p>
        <p>{{ vacancy.description }}</p>
        <p>Зарплата: {{ vacancy.salary }}</p>
    </article>
{% empty %}
    <p>Активных вакансий нет.</p>
{% endfor %}
</div>
{% endblock %}
